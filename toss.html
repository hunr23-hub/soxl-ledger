<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EFF1F3">
<title>무한매수법 장부</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🔁%3C/text%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap');

:root{
  --bg:#EFF1F3; --surface:#FFFFFF; --surface-2:#F6F7F9; --surface-3:#EAEDF1;
  --ink:#16181C; --ink-2:#59606A; --ink-3:#888F99;
  --line:#DCE0E6; --line-2:#E9ECF0;
  --brass:#0E7C6B; --brass-2:#149684; --brass-bg:#DFF1ED;
  --up:#C4362D; --up-bg:#FAEBE9;
  --down:#2A61BC; --down-bg:#E8EFFA;
  --flat:#7A828C;
  --shadow:0 1px 2px rgba(16,20,28,.06), 0 4px 14px rgba(16,20,28,.05);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1114; --surface:#181B20; --surface-2:#1F232A; --surface-3:#262B33;
    --ink:#E6E9ED; --ink-2:#99A1AB; --ink-3:#6D757F;
    --line:#272C34; --line-2:#20242B;
    --brass:#4FC7B2; --brass-2:#6FD9C6; --brass-bg:#0F2C28;
    --up:#EE6157; --up-bg:#2A1715;
    --down:#5E9CF2; --down-bg:#131E2E;
    --flat:#767E88;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1114; --surface:#181B20; --surface-2:#1F232A; --surface-3:#262B33;
  --ink:#E6E9ED; --ink-2:#99A1AB; --ink-3:#6D757F;
  --line:#272C34; --line-2:#20242B;
  --brass:#4FC7B2; --brass-2:#6FD9C6; --brass-bg:#0F2C28;
  --up:#EE6157; --up-bg:#2A1715;
  --down:#5E9CF2; --down-bg:#131E2E;
  --flat:#767E88;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}

/* ---------- shell ---------- */
.shell{max-width:620px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
header{
  position:sticky;top:0;z-index:20;background:var(--surface);
  border-bottom:1px solid var(--line);
  padding:10px 16px 9px;display:flex;align-items:center;gap:12px;
}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand b{font-size:14px;font-weight:600;letter-spacing:.02em}
.brand span{font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.hd-total{margin-left:auto;text-align:right;line-height:1.2}
.hd-total .v{font-size:15px;font-weight:600}
.hd-total .s{font-size:11px;color:var(--ink-3)}
.savebtn{
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);
  border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:500;cursor:pointer;
  white-space:nowrap;transition:background .15s,border-color .15s,color .15s;
}
.savebtn:hover{background:var(--surface-3)}
.savebtn[data-dirty="1"]{background:var(--brass);border-color:var(--brass);color:#fff}
.savebtn:disabled{opacity:.55;cursor:default}
.savebtn:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--brass-2);outline-offset:2px}

main{flex:1;padding:14px 14px 26px;display:flex;flex-direction:column;gap:14px}

nav{
  position:sticky;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  background:none;border:0;padding:9px 0 10px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11.5px;color:var(--ink-3);border-top:2px solid transparent;margin-top:-1px;
}
nav button .ic{width:19px;height:19px;display:block}
nav button[aria-current="true"]{color:var(--brass);border-top-color:var(--brass);font-weight:600}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:baseline;gap:8px;padding:13px 15px 0}
.card-h h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.card-h .aside{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
.card-b{padding:12px 15px 14px}

/* hero summary */
.hero{padding:18px 16px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.hero .lab{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.hero .big{font-size:34px;font-weight:600;line-height:1.05;margin-top:5px;letter-spacing:-.02em}
.hero .sub{margin-top:3px;font-size:15px;font-weight:500}
.hero .krw{margin-top:9px;font-size:13.5px;color:var(--ink-2)}
.fxbox{margin-top:12px;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.fxbox > div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 12px;border-top:1px solid var(--line-2);font-size:13px}
.fxbox > div:first-child{border-top:0}
.fxbox span{color:var(--ink-2);font-size:12.5px}
.fxbox b{font-weight:600}
.fxbox .tot{background:var(--surface-2)}
.fxbox .tot span{color:var(--ink);font-weight:600;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-2);border-radius:11px;overflow:hidden;margin-top:15px}
.grid2 div{background:var(--surface-2);padding:10px 12px}
.grid2 .k{font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.grid2 .v{font-size:14.5px;font-weight:600;margin-top:2px;line-height:1.3}

/* chart */
.chartwrap{padding:6px 8px 2px}
svg.chart{display:block;width:100%;height:170px;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .zero{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 3;opacity:.7}
.chart .ln{fill:none;stroke:var(--brass);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--brass);opacity:.11}
.chart .dot{fill:var(--brass)}
.chart text{font-family:'IBM Plex Mono',monospace;font-size:9.5px;fill:var(--ink-3)}

/* rows / tables */
.rows{display:flex;flex-direction:column}
.row{display:grid;align-items:center;gap:8px;padding:9px 15px;border-top:1px solid var(--line-2)}
.row:first-child{border-top:0}
.rowhead{display:grid;gap:8px;padding:7px 15px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2);border-bottom:1px solid var(--line)}
.p-cols{grid-template-columns:minmax(0,1fr) 58px 68px 60px}
.row.p-cols{font-size:12.5px;padding-left:13px;padding-right:13px}
.rowhead.p-cols{padding-left:13px;padding-right:13px}
.row.p-cols input::-webkit-calendar-picker-indicator{opacity:.45;padding:0;margin:0;width:13px}
.row.p-cols input[type=date]{font-size:12.5px}
.rowhead.p-cols div:not(:first-child),.row.p-cols>*:not(:first-child){text-align:right}
.tl-cols{grid-template-columns:1fr auto}

/* trade card */
.tcard{border-top:1px solid var(--line-2);padding:11px 15px;cursor:pointer}
.tcard:first-child{border-top:0}
.tcard[aria-expanded="true"]{background:var(--surface-2);cursor:default}
.tcard .l1{display:flex;align-items:baseline;gap:9px}
.tcard .dt{font-size:13px;font-weight:600}
.tcard .cl{font-size:12.5px;color:var(--ink-2)}
.tcard .kr{font-size:11px;color:var(--ink-3);letter-spacing:.01em}
.tcard .chg{margin-left:auto;font-size:12.5px;font-weight:600}
.tcard .l2{display:flex;align-items:baseline;gap:7px;margin-top:5px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.tag{font-size:10.5px;padding:2px 6px;border-radius:5px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.tag.b{background:var(--up-bg);color:var(--up)}
.tag.s{background:var(--down-bg);color:var(--down)}
.tag.n{background:var(--surface-3);color:var(--ink-3)}
.tag.w{background:var(--brass-bg);color:var(--brass)}
.pnl{margin-left:auto;font-size:13px;font-weight:600}

/* editor */
.ed{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:10px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fgrid.f3{grid-template-columns:1fr 1fr 1fr}
label.f{display:flex;flex-direction:column;gap:4px;min-width:0}
label.f > span{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
label.f input{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:8px 9px;font-size:14px;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;
}
label.f input[type=date],label.f input.txt{font-family:inherit}
label.f input::placeholder{color:var(--ink-3);opacity:.7}
.derived{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-2);border-radius:10px;overflow:hidden}
.derived div{background:var(--surface);padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.derived .k{font-size:10.5px;letter-spacing:.05em;color:var(--ink-3);white-space:nowrap}
.derived .v{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edfoot{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 13px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--brass);border-color:var(--brass);color:#fff;font-weight:600}
.btn.dan{color:var(--up);border-color:var(--up-bg)}
.btn.dan.arm{background:var(--up);border-color:var(--up);color:#fff;font-weight:600}
.btn.wide{width:100%;justify-content:center;text-align:center}
.edfoot .btn.dan{margin-left:auto}

.addbar{padding:11px 15px;border-top:1px solid var(--line-2)}
.addbar.top{border-top:0;border-bottom:1px solid var(--line-2);padding-top:12px}

.note{font-size:12px;color:var(--ink-2);line-height:1.55}
.warn{background:var(--brass-bg);border:1px solid color-mix(in srgb,var(--brass) 30%,transparent);border-radius:11px;padding:11px 13px;font-size:12.5px;color:var(--ink)}
.warn b{color:var(--brass);font-weight:600}
.warn ul{margin:6px 0 0;padding-left:17px} .warn li{margin:2px 0}
.empty{padding:26px 15px;text-align:center;color:var(--ink-3);font-size:13px}
.rowhead{display:grid;gap:8px;padding:7px 15px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2);border-bottom:1px solid var(--line)}
.p-cols{grid-template-columns:minmax(0,1fr) 92px 30px}
.row.p-cols{font-size:12.5px;padding-left:13px;padding-right:13px}
.rowhead.p-cols{padding-left:13px;padding-right:13px}
.rowhead.p-cols div:not(:first-child),.row.p-cols>*:not(:first-child){text-align:right}
.row.p-cols input[type=date]{font-size:12.5px}
.row.p-cols input::-webkit-calendar-picker-indicator{opacity:.45;padding:0;margin:0;width:13px}
.row.p-cols input.pdate{border:0;background:none;padding:0;font-family:inherit;width:100%;min-width:0;color:var(--ink)}
.row.p-cols input.pin{border:0;background:none;padding:3px 5px;width:100%;min-width:0;text-align:right;font-family:inherit;font-weight:600;font-size:13px;color:var(--ink);border-radius:5px}
.row.p-cols input.pin::placeholder{color:var(--brass);font-weight:500;opacity:1;font-size:11px}
.row.p-cols input.pin:placeholder-shown{background:var(--brass-bg);box-shadow:inset 0 0 0 1px var(--brass-2)}
.row.p-cols input.pin:focus{outline:0;background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--brass)}
.xdel{border:0;background:none;color:var(--ink-3);font-size:17px;line-height:1;padding:4px 0;width:100%;border-radius:6px;cursor:pointer;font-family:inherit;-webkit-appearance:none}
.xdel.arm{background:var(--down);color:#fff;font-size:10.5px;font-weight:700;padding:6px 0}
.fillbar{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 12px;padding:13px 15px;border:1px solid var(--brass-2);background:var(--brass-bg);color:var(--brass);border-radius:var(--r);font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;text-align:left}
.fillbar .fb-a{margin-left:auto;font-weight:500;opacity:.85;white-space:nowrap}
.lagbar{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}
.lagbtn{padding:9px 6px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);border-radius:9px;font-family:inherit;font-size:12.5px;cursor:pointer}
.lagbtn.on{background:var(--brass);border-color:var(--brass);color:#fff;font-weight:600}
.tgrid .alt{display:block;margin-top:3px;font-size:10.5px;font-weight:400;color:var(--ink-3);letter-spacing:0}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.cmpr{padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:3px}
.cmpr>span:first-child{font-size:10.5px;letter-spacing:.04em;color:var(--ink-3)}
.cmpr>b{font-size:16px}
.cmpr .o{font-size:10.5px;color:var(--ink-3)}
.cmpr.on{border-color:var(--brass);background:var(--brass-bg)}
.cmpr.on>span:first-child,.cmpr.on .o{color:var(--brass)}
.cmpr.on>b{color:var(--brass)}
.toast{
  position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(8px);
  background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:10px;font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;box-shadow:var(--shadow);
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.tcard .rl{margin-left:auto;text-align:right}
.morebar{padding:0 15px 13px}

/* 체결 입력 */
.fillbox{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface)}
.fillhead{padding:7px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);
  font-size:10.5px;letter-spacing:.09em;color:var(--ink-3);font-weight:600}
.fillrow{display:grid;grid-template-columns:14px 1fr 0.82fr 0.9fr;gap:6px;align-items:center;
  padding:6px 10px 6px 7px;border-top:1px solid var(--line-2)}
.fillbox .fillrow:first-of-type{border-top:0}
.fillrow .no{font-size:11px;color:var(--ink-3);text-align:center;
  font-family:'IBM Plex Mono',ui-monospace,monospace}
.fillrow input{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);
  border-radius:8px;padding:7px 7px;font-size:13px;
  font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.fillrow input::placeholder{font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;
  color:var(--ink-3);opacity:.7;font-size:11.5px}
.fsum{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  padding:8px 12px;background:var(--surface-2);border-top:1px solid var(--line-2);
  font-size:12px;color:var(--ink-2)}
.fsum b{font-weight:600;color:var(--ink);font-size:13px}
.fillrow.feerow{border-top:1px solid var(--line)}

/* 오늘 주문 카드 */
.ord{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.ord + .ord{margin-top:10px}
.ordh{padding:8px 13px;background:var(--surface-2);border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;gap:8px;font-size:11.5px;font-weight:600;letter-spacing:.03em}
.ordh .side{padding:2px 7px;border-radius:5px;font-size:10.5px}
.ordh .side.b{background:var(--up-bg);color:var(--up)}
.ordh .side.s{background:var(--down-bg);color:var(--down)}
.ordh .kind{margin-left:auto;color:var(--ink-3);font-weight:500}
.ordb{padding:11px 13px;display:flex;align-items:baseline;gap:10px}
.ordb .q{font-size:22px;font-weight:600;letter-spacing:-.02em}
.ordb .at{font-size:13px;color:var(--ink-2)}
.ordb .amt{margin-left:auto;font-size:13px;color:var(--ink-3)}
.tgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line-2);
  border-radius:11px;overflow:hidden;margin-top:14px}
.tgrid div{background:var(--surface-2);padding:9px 10px}
.tgrid .k{font-size:10.5px;color:var(--ink-3);letter-spacing:.03em}
.tgrid .v{font-size:14px;font-weight:600;margin-top:2px}
.bar{height:7px;border-radius:4px;background:var(--surface-3);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--brass);border-radius:4px}
.barlab{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-top:5px}
.half.rev{background:var(--down-bg);color:var(--down)}
.half{display:inline-block;padding:1px 6px;border-radius:5px;background:var(--brass-bg);
  color:var(--brass);font-size:10.5px;font-weight:600;margin-left:6px}

/* 폭락장 대비 추가 매수 사다리 */
.ladder{margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.ladh{padding:8px 13px;background:var(--up-bg);color:var(--up);font-size:11.5px;font-weight:600;
  border-bottom:1px solid var(--line)}
.ladr{display:flex;align-items:baseline;gap:9px;padding:7px 13px;border-top:1px solid var(--line-2);font-size:13px}
.ladder .ladr:first-of-type{border-top:0}
.ladr > span:first-child{color:var(--ink-3);font-size:11px}
.ladr b{font-weight:600;font-size:14px}
.ladr .x{color:var(--ink-2);font-size:12px}
.ladr .dv{margin-left:auto;color:var(--ink-3);font-size:11px}

/* T값 · Star값 필 */
.pills{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pill{border-radius:13px;padding:11px 14px;border:1px solid var(--line)}
.pill.t{background:var(--brass-bg);border-color:color-mix(in srgb,var(--brass) 28%,transparent)}
.pill.s{background:var(--surface-2)}
.pill .pl{display:block;font-size:11px;letter-spacing:.05em;color:var(--ink-3)}
.pill.t .pl{color:var(--brass)}
.pill b{display:block;margin-top:3px;font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.pill b i{font-style:normal;font-size:12px;font-weight:500;color:var(--ink-3);margin-left:3px}

/* 모드 선택 */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.segb{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 4px;
  font-size:12px;color:var(--ink-2);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.segb.on{background:var(--brass);border-color:var(--brass);color:#fff;font-weight:600}
.manual{display:inline-block;margin-left:5px;padding:1px 6px;border-radius:5px;background:var(--surface-3);
  color:var(--ink-3);font-size:10.5px;font-weight:600}

.bkbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<div id="app"></div>
<script id="state" type="application/json">{"settings":{"ticker":"SOXL","broker":"토스증권","split":20,"target":20,"feeRate":0,"ladderN":7,"starLag":1,"fxNow":null,"fxDefault":null},"prices":[],"trades":[],"cycles":[],"savedAt":null}</script>
<script id="code" type="text/plain">
/* 무한매수법 장부 (토스증권 SOXL) */
(function () {
  'use strict';

  var LS = 'toss-ib-v1';
  var S = JSON.parse(document.getElementById('state').textContent);
  S.settings = S.settings || {}; S.trades = S.trades || [];
  S.cycles = S.cycles || []; S.prices = S.prices || [];

  var dirty = false;
  try {
    var raw = localStorage.getItem(LS);
    if (raw) { var dd = JSON.parse(raw); if (dd && dd.savedAt && new Date(dd.savedAt) > new Date(S.savedAt || 0)) { S = dd; } }
  } catch (e) {}

  var tab = 'today', open = null, openC = null, pendingDel = null;
  var lim = { log: 25, cycle: 20 };
  var app = document.getElementById('app');
  var BKNAME = 'toss-ledger', FXKEY = 'fxNow';

  /* ---------- 유틸 ---------- */
  function n(v) { if (v === null || v === undefined || v === '') return null; var x = +String(v).replace(/[,\s$₩%]/g, ''); return isFinite(x) ? x : null; }
  function usd(v, sign) { if (v === null || v === undefined || !isFinite(v)) return '—'; var s = v < 0 ? '-' : (sign && v > 0 ? '+' : ''); return s + '$' + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function krw(v, sign) { if (v === null || v === undefined || !isFinite(v)) return '—'; var s = v < 0 ? '-' : (sign && v > 0 ? '+' : ''); return s + '₩' + Math.round(Math.abs(v)).toLocaleString('ko-KR'); }
  function pct(v, sign, dp) { if (v === null || v === undefined || !isFinite(v)) return '—'; var s = v < 0 ? '-' : (sign && v > 0 ? '+' : ''); return s + Math.abs(v).toFixed(dp === undefined ? 2 : dp) + '%'; }
  function qty(v) { if (v === null || v === undefined || !isFinite(v)) return '—'; return v.toLocaleString('ko-KR', { maximumFractionDigits: 4 }); }
  function cls(v) { return v === null || v === undefined || !isFinite(v) || v === 0 ? 'flat' : (v > 0 ? 'up' : 'down'); }
  function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function md(s) { if (!s) return '—'; var p = String(s).split('-'); return p.length === 3 ? (+p[1]) + '/' + (+p[2]) : s; }
  function today() { return new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10); }
  function shift(d, k) { var x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + k); return x.toISOString().slice(0, 10); }
  function krDate(d) { return d ? shift(d, 1) : null; }
  function lastUsDate() { var d = shift(today(), -1); while ([0, 6].indexOf(new Date(d + 'T00:00:00Z').getUTCDay()) >= 0) d = shift(d, -1); return d; }
  function days(a, b) { if (!a || !b) return null; return Math.round((new Date(b) - new Date(a)) / 86400000); }
  function byDate(a, b) { return a.d < b.d ? -1 : a.d > b.d ? 1 : 0; }
  function nextWk(d) { var x = shift(d, 1); while ([0, 6].indexOf(new Date(x + 'T00:00:00Z').getUTCDay()) >= 0) x = shift(x, 1); return x; }
  function missingClose() {
    var d = lastUsDate();
    for (var i = 0; i < 6; i++) {
      var hit = null;
      for (var j = 0; j < S.prices.length; j++) if (S.prices[j].d === d) { hit = S.prices[j]; break; }
      if (!hit || hit.c === null || hit.c === undefined || hit.c === '') return d;
      d = shift(d, -1);
      while ([0, 6].indexOf(new Date(d + 'T00:00:00Z').getUTCDay()) >= 0) d = shift(d, -1);
    }
    return null;
  }
  function priceCard() {
    var list = S.prices.slice().sort(byDate).reverse().slice(0, 8);
    var h = '<section class="card"><div class="card-h"><h2>최근 종가</h2><div class="aside">' + S.prices.length + '일</div></div>' +
      '<div class="addbar top"><button class="btn wide" data-add="price">+ 종가 추가</button></div>' +
      '<div class="rowhead p-cols"><div>날짜</div><div>종가</div><div></div></div><div class="rows">';
    if (!list.length) h += '<div class="empty">종가를 추가해 주세요.</div>';
    list.forEach(function (p) {
      var i = S.prices.indexOf(p), dk = 'prices:' + i, arm = pendingDel === dk;
      h += '<div class="row p-cols">' +
        '<input class="txt pdate" data-k="prices" data-i="' + i + '" data-f="d" type="date" value="' + esc(p.d) + '">' +
        '<div class="num"><input class="pin" data-k="prices" data-i="' + i + '" data-f="c" inputmode="decimal" placeholder="입력" value="' + (p.c === null || p.c === undefined ? '' : p.c) + '"></div>' +
        '<button class="xdel' + (arm ? ' arm' : '') + '" data-del="' + dk + '" aria-label="이 줄 삭제">' + (arm ? '삭제' : '×') + '</button></div>';
    });
    return h + '</div><div class="note" style="padding:11px 15px 13px">별지점은 <b>직전 5거래일 종가 평균</b>이라, 매매가 없던 날도 종가를 채워야 정확해요. 오른쪽 <b>×</b>를 두 번 누르면 삭제됩니다.</div></section>';
  }
  function roll(list) {
    var q = 0, amt = 0, fee = 0;
    (list || []).forEach(function (x) {
      var p = n(x.p), qq = n(x.q);
      if (p !== null && qq) { q += qq; amt += p * qq; }
      fee += n(x.f) || 0;
    });
    return { q: q, amt: amt, fee: fee, avg: q ? amt / q : null };
  }

  /* ---------- 계산 ---------- */
  function derive() {
    var prices = S.prices.slice().sort(byDate);
    var pmap = {}; prices.forEach(function (p) { pmap[p.d] = p.c; });
    var lastP = null;
    for (var z = prices.length - 1; z >= 0; z--) { if (prices[z].c) { lastP = prices[z]; break; } }
    var withC = prices.filter(function (p) { return p.c; });
    var lag = n(S.settings.starLag) ? 1 : 0;          // 1이면 가장 최근 종가를 빼고 직전 5일로
    function avg5(list) { return list.length === 5 ? list.reduce(function (a, p) { return a + p.c; }, 0) / 5 : null; }
    var incList = withC.slice(-5);                                  // 최신 종가 포함
    var lagList = withC.length ? withC.slice(0, -1).slice(-5) : [];  // 하루 전까지
    var starInc = avg5(incList), starLag = avg5(lagList);
    var last5 = lag ? lagList : incList;
    var star5 = lag ? starLag : starInc;

    var trades = S.trades.slice().sort(byDate);
    var cycles = S.cycles.slice().sort(function (a, b) { return (a.start || '') < (b.start || '') ? -1 : 1; });

    // 매매일을 회차에 배정. 경계일(앞 회차 종료일 = 뒤 회차 시작일)에는
    // 매도는 끝나는 회차로, 매수는 시작하는 회차로 보낸다.
    function inRange(c, d) { return c.start && d >= c.start && (!c.end || d <= c.end); }
    function sellCycle(d) {                             // 가장 이른(끝나는) 회차
      for (var i = 0; i < cycles.length; i++) if (inRange(cycles[i], d)) return cycles[i];
      return null;
    }
    function buyCycle(d) {                              // 가장 늦은(시작하는) 회차
      for (var i = cycles.length - 1; i >= 0; i--) if (inRange(cycles[i], d)) return cycles[i];
      return null;
    }
    function cycleOf(d) { return buyCycle(d) || sellCycle(d); }

    var res = [], cumPnl = 0, cumKRW = 0;
    cycles.forEach(function (c) {
      var list = trades.filter(function (t) { return sellCycle(t.d) === c || buyCycle(t.d) === c; });
      var posQ = 0, cost = 0, pnl = 0, pnlKRW = 0, buyAmt = 0, sellAmt = 0, feeAll = 0;
      var rows = [];
      list.forEach(function (t) {
        var B = buyCycle(t.d) === c ? roll(t.buys) : roll(null);
        var SS = sellCycle(t.d) === c ? roll(t.sells) : roll(null);
        var fx = n(t.fx) || n(S.settings.fxDefault);
        if (!B.q && !SS.q) return;                      // 이 회차 몫이 없는 날은 건너뜀
        var r = { t: t, d: t.d, bq: B.q, bp: B.avg, sq: SS.q, sp: SS.avg, feeB: B.fee, feeS: SS.fee, fx: fx };
        if (SS.q) {                                    // 매도 먼저 (같은 날 쿼터매도 후 매수)
          var held = Math.min(SS.q, posQ), avg = posQ ? cost / posQ : 0;
          r.matched = held; r.cost = avg * held;
          r.pnl = held ? SS.avg * held - r.cost - SS.fee : null;
          r.rate = r.cost ? r.pnl / r.cost * 100 : null;
          if (r.pnl !== null) { pnl += r.pnl; pnlKRW += r.pnl * (fx || 0); }
          r.unmatched = SS.q - held;
          cost -= avg * held; posQ -= held;
          if (posQ < 1e-9) { posQ = 0; cost = 0; }
          sellAmt += SS.amt;
        }
        if (B.q) { cost += B.amt + B.fee; posQ += B.q; buyAmt += B.amt + B.fee; }
        feeAll += B.fee + SS.fee;
        r.posQ = posQ; r.avg = posQ ? cost / posQ : 0;
        r.close = pmap[t.d] === undefined ? null : pmap[t.d];
        rows.push(r);
      });
      var seed = n(c.seed), split = n(S.settings.split) || 40, target = n(S.settings.target) || 20;
      var Tauto = seed ? buyAmt / (seed / split) : null;
      var T = n(c.tval) !== null ? n(c.tval) : Tauto;
      var left = seed ? seed - buyAmt + sellAmt : null;   // 매도금은 다시 잔금으로
      var k = 40 / split;                              // 40분할=1, 20분할=2
      var starPct = T === null ? null : target - k * T;
      var avg = posQ ? cost / posQ : null;
      var star = (avg && starPct !== null) ? avg * (1 + starPct / 100) : null;
      // 수동 보유수량/평단은 '기준일(asOf) 시점의 스냅샷' — 그 뒤 체결은 앱이 이어서 굴린다
      var mq = n(c.posQ), ma = n(c.avg), asOf = c.asOf || null;
      var uq = mq !== null ? mq : posQ, ua = ma !== null ? ma : avg;
      if ((mq !== null || ma !== null) && asOf) {
        var aq = uq || 0, ac = (ua || 0) * aq;
        rows.forEach(function (r) {
          if (!r.d || r.d <= asOf) return;
          if (r.sq) {
            var av2 = aq ? ac / aq : 0, hq = Math.min(r.sq, aq);
            ac -= av2 * hq; aq -= hq;
            if (aq < 1e-9) { aq = 0; ac = 0; }
          }
          if (r.bq) { ac += r.bp * r.bq + (r.feeB || 0); aq += r.bq; }
        });
        uq = aq; ua = aq ? ac / aq : null;
      }
      var manLeft = n(c.left), useLeft = manLeft !== null ? manLeft : left;
      if (manLeft !== null && asOf) {                  // 수동 잔금도 기준일 이후 체결을 반영
        rows.forEach(function (r) {
          if (!r.d || r.d <= asOf) return;
          if (r.sq) useLeft += r.sp * r.sq - (r.feeS || 0);
          if (r.bq) useLeft -= r.bp * r.bq + (r.feeB || 0);
        });
      }
      var unit = (useLeft !== null && split - T > 0.0001) ? useLeft / (split - T) : null;
      var revUnit = useLeft !== null ? useLeft / 4 : null;   // 리버스(소진)모드: 매수금 = 잔금 ÷ 4
      var useAvg0 = ua;
      var exitPx = useAvg0 ? useAvg0 * (1 - target / 100) : null;   // 이 위로 종가가 올라오면 일반모드 복귀
      var lastC = lastP ? lastP.c : null;
      var autoRev = T !== null && T > split - 1 && !(exitPx !== null && lastC !== null && lastC > exitPx);
      var isRev = c.mode === 'reverse' || (c.mode !== 'normal' && autoRev);
      var manual = n(c.rate), manualPnl = n(c.pnl);
      var usePnl = manualPnl !== null ? manualPnl : (c.end ? pnl : null);
      if (usePnl !== null) { cumPnl += usePnl; cumKRW += usePnl * (n(S.settings.fxNow) || n(S.settings.fxDefault) || 0); }
      res.push({
        c: c, rows: rows, open: !c.end,
        posQ: posQ, cost: cost, avg: avg, buyAmt: buyAmt, sellAmt: sellAmt, fee: feeAll,
        pnl: pnl, pnlKRW: pnlKRW, usePnl: usePnl, cumPnl: cumPnl, cumKRW: cumKRW,
        rate: manual !== null ? manual : (cost === 0 && buyAmt ? pnl / (buyAmt - pnl) * 100 : null),
        seed: seed, split: split, target: target, T: T, Tauto: Tauto,
        left: useLeft, leftAuto: left, manualLeft: manLeft !== null, unit: unit, revUnit: revUnit,
        starPct: starPct, star: star, half: T !== null && T < split / 2,
        star5: star5, last5: last5, starInc: starInc, starLag: starLag, incList: incList, lagList: lagList, lag: lag,
        usePosQ: uq, useAvg: ua, anchored: !!((mq !== null || ma !== null) && asOf), asOf: asOf,
        useUnit: n(c.unit) !== null ? n(c.unit) : (isRev ? revUnit : unit),
        autoReverse: autoRev, exitPrice: exitPx,
        reverse: isRev,
        revFirst: !!(c.revStart && c.revStart === lastUsDate()),
        dur: days(c.start, c.end || today()),
        value: (lastP && posQ) ? posQ * lastP.c : null,
        openPnl: (lastP && posQ && avg) ? (lastP.c - avg) * posQ : null
      });
    });

    var cur = null;
    for (var i = res.length - 1; i >= 0; i--) { if (res[i].open) { cur = res[i]; break; } }

    var mo = {}, order = [];
    res.forEach(function (x) {
      if (x.usePnl === null || !x.c.end) return;
      var kk = x.c.end.slice(0, 7);
      if (!mo[kk]) { mo[kk] = { k: kk, usd: 0, n: 0 }; order.push(kk); }
      mo[kk].usd += x.usePnl; mo[kk].n++;
    });

    return {
      prices: prices, pmap: pmap, lastP: lastP, star5: star5, res: res, cur: cur,
      starInc: starInc, starLag: starLag, incList: incList, lagList: lagList, lag: lag,
      months: order.map(function (kk) { return mo[kk]; }),
      totalPnl: cumPnl, totalKRW: cumKRW, cycleOf: cycleOf
    };
  }

  /* ---------- 저장 ---------- */
  function markDirty() {
    dirty = true; S.savedAt = new Date().toISOString();
    try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
    var b = document.getElementById('savebtn');
    if (b) { b.dataset.dirty = '1'; b.textContent = '저장'; }
  }
  function buildDoc() {
    var css = document.getElementById('css').textContent, code = document.getElementById('code').textContent;
    var json = JSON.stringify(S).replace(/</g, '\\u003c');
    var st = '<scr' + 'ipt', en = '</scr' + 'ipt>';
    return '<!doctype html>\n<html lang="ko"><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">' +
      '<title>무한매수법 장부</title><style id="css">' + css + '</style></head><body><div id="app"></div>' +
      st + ' id="state" type="application/json">' + json + en +
      st + ' id="code" type="text/plain">' + code + en +
      st + '>(new Function(document.getElementById("code").textContent))();' + en + '</body></html>';
  }
  var saving = false;
  function save() {
    var b = document.getElementById('savebtn');
    S.savedAt = new Date().toISOString();
    try { localStorage.setItem(LS, JSON.stringify(S)); }
    catch (e) { toast('이 브라우저에 저장할 수 없어요. 시크릿 모드인지 확인해 주세요.'); return; }
    dirty = false;
    if (b) { b.dataset.dirty = '0'; b.textContent = '저장됨'; }
    toast('이 기기에 저장했어요.');
  }

  var tt;
  function toast(m) { var el = document.getElementById('toast'); el.textContent = m; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(function () { el.classList.remove('on'); }, 3200); }

  /* ---------- 아이콘 ---------- */
  function icon(name) {
    var p = {
      today: '<path d="M10 3.5v13M3.5 10h13"/><circle cx="10" cy="10" r="7.2"/>',
      cycle: '<path d="M16.5 10a6.5 6.5 0 1 1-2-4.7"/><path d="M17 3.5V7h-3.5"/>',
      log: '<rect x="3.5" y="3.5" width="13" height="13" rx="2"/><path d="M7 8h6M7 12h4"/>',
      month: '<rect x="3.5" y="4.5" width="13" height="12" rx="2"/><path d="M3.5 8.5h13M7 3v3M13 3v3"/>'
    }[name];
    return '<svg class="ic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>';
  }

  /* ---------- 렌더 ---------- */
  function render() {
    var v = derive();
    app.innerHTML = '<div class="shell">' + header(v) + '<main>' +
      ({ today: todayTab, cycle: cycleTab, log: logTab, month: monthTab }[tab])(v) +
      '</main><nav>' + nav('today', '오늘') + nav('cycle', '회차') + nav('log', '매매') + nav('month', '월별') +
      '</nav></div><div class="toast" id="toast"></div>';
    applyCalc(v);
  }
  function nav(id, l) { return '<button data-tab="' + id + '" aria-current="' + (tab === id) + '">' + icon(id) + l + '</button>'; }
  function header(v) {
    return '<header><div class="brand"><b>무한매수법 · ' + esc(S.settings.ticker || 'SOXL') + '</b><span>' +
      esc(S.settings.broker || '') + (v.lastP ? ' · ' + md(v.lastP.d) + ' $' + v.lastP.c : '') +
      ((n(S.settings.fxNow) || n(S.settings.fxDefault)) ? ' · \u20a9' + (n(S.settings.fxNow) || n(S.settings.fxDefault)).toLocaleString('ko-KR') : '') + '</span></div>' +
      '<div class="hd-total"><div class="v num ' + cls(v.totalPnl) + '">' + usd(v.totalPnl, true) + '</div>' +
      '<div class="s num">누적 실현</div></div>' +
      '<button class="savebtn" id="savebtn" data-dirty="' + (dirty ? '1' : '0') + '">' + (dirty ? '저장' : '저장됨') + '</button></header>';
  }

  /* ------- 오늘 ------- */
  function todayTab(v) {
    var need = missingClose();
    var fb = need ? '<button class="fillbar" data-fill="' + need + '"><span class="fb-t">' + md(need) + ' 종가가 비어 있어요</span><span class="fb-a">입력하기 &rsaquo;</span></button>' : '';
    var c = v.cur, h = fb;
    if (!c) {
      h += '<div class="card"><div class="card-b"><div class="empty">진행 중인 회차가 없어요.<br>회차 탭에서 새 회차를 시작하세요.</div></div></div>';
      return h + settingsCard() + backupBar();
    }
    var cy = c.c;
    var modeLab = (c.reverse ? '<span class="half rev">리버스모드</span>'
      : (c.half ? '<span class="half">전반전</span>' : '<span class="half">후반전</span>')) +
      (c.c.mode ? '<span class="manual">수동</span>' : '');
    h += '<section class="hero">' +
      '<div class="lab">' + (cy.no || '') + '회차 · ' + c.dur + '일째' + modeLab + '</div>' +
      '<div class="pills">' +
      '<div class="pill t"><span class="pl">T 값</span><b class="num">' +
      (c.T === null ? '—' : c.T.toFixed(2)) + '<i>회</i></b></div>' +
      '<div class="pill s"><span class="pl">Star 값</span><b class="num ' + cls(c.starPct) + '">' +
      (c.starPct === null ? '—' : c.starPct.toFixed(2)) + '<i>%</i></b></div>' +
      '</div>' +
      '<div class="sub num" style="margin-top:12px">' + (c.useAvg ? '평단 ' + usd(c.useAvg) : '보유 없음') + ' · ' + qty(c.usePosQ) + '주' +
      (c.anchored ? '<span style="opacity:.65;font-size:11px;font-weight:400"> · 수동 ' + md(c.asOf) + ' 기준 + 이후 체결</span>' : '') + '</div>';

    if (c.seed) {
      var prog = Math.max(0, Math.min(100, c.T / c.split * 100));
      h += '<div class="bar"><i style="width:' + prog.toFixed(1) + '%"></i></div>' +
        '<div class="barlab"><span>' + usd(c.buyAmt) + ' 투입</span><span>원금 ' + usd(c.seed) + ' · ' + c.split + '분할</span></div>';
    }
    var openP = (lastClose(v) && c.usePosQ && c.useAvg) ? (lastClose(v) - c.useAvg) * c.usePosQ : null;
    h += '<div class="tgrid">' +
      tcell('잔금', c.left !== null && c.left < 0 ? '소진' : usd(c.left)) + tcell(c.reverse ? '매수금 (잔금÷4)' : '1회 투자금', usd(c.useUnit)) +
      tcell(c.reverse ? '별지점 (5일평균)' : '별지점 (평단×별%)',
        usd(c.reverse ? c.star5 : c.star) +
        (c.reverse && c.starInc !== null && c.starLag !== null && Math.abs(c.starInc - c.starLag) > 0.0001
          ? '<span class="alt">' + (c.lag ? '최신 포함 ' + usd(c.starInc) : '하루 전 ' + usd(c.starLag)) + '</span>' : '')) +
      tcell('현재가', usd(lastClose(v))) +
      tcell('평가손익', '<span class="' + cls(openP) + '">' + usd(openP, true) + '</span>') +
      tcell('목표가', usd(c.useAvg ? c.useAvg * (1 + c.target / 100) : null)) +
      '</div></section>';

    // 오늘 주문
    h += '<section class="card"><div class="card-h"><h2>오늘 주문</h2><div class="aside">' +
      (c.reverse ? '리버스모드 (T > ' + (c.split - 1) + ')'
        : (c.half ? '전반전 (T < ' + (c.split / 2) + ')' : '후반전 (T ≥ ' + (c.split / 2) + ')')) +
      '</div></div><div class="card-b">';
    if (c.reverse) {
      if (!c.star5) {
        h += '<div class="note">직전 5거래일 종가가 있어야 별지점을 계산해요. 매매 탭에서 <b>종가</b>를 채워 주세요.</div>';
      } else {
        var down = Math.floor(c.star5 * 100) / 100, up = Math.ceil(c.star5 * 100) / 100;
        var div = c.split === 20 ? 10 : 20;
        var sq2 = Math.floor((c.usePosQ || 0) / div);
        var bq2 = c.useUnit ? Math.floor(c.useUnit / down) : 0;
        var spent = c.useUnit && bq2 < 1;               // 쿼터매수로 1주도 못 사면 소진
        if (c.revFirst || spent) {                      // 첫날 또는 소진: 매수 없이 MOC 매도만
          if (sq2 > 0) h += ordCard('s', 'MOC 매도', '종가 무조건 · ' + (c.revFirst ? '전체' : '직전보유') + ' ÷ ' + div, null, lastClose(v), sq2);
          h += '<div class="note" style="margin-top:11px">' +
            (c.revFirst
              ? '리버스 <b>첫날</b>이라 매도만 걸어요. 별지점 계산 없이 <b>MOC(종가) 매도</b>이고, 매수는 내일부터 시작합니다.'
              : '잔금 ÷ 4 (<b>' + usd(c.useUnit) + '</b>)로 별지점 <b>' + usd(down) + '</b>에서 1주도 못 사요 → <b>소진</b>. ' +
                '매수는 걸지 않고 <b>MOC 매도</b>만 시행합니다.') + '</div>';
        } else {
          if (bq2 > 0) h += ordCard('b', 'LOC 리버스★', '5일평균 아래', null, down, bq2);
          if (sq2 > 0) h += ordCard('s', 'LOC 리버스★', '5일평균 위 · 직전보유 ÷ ' + div, null, up, sq2);
          h += ladder(c.useUnit, bq2);
        }
        h += '<div class="note" style="margin-top:11px">별지점은 <b>직전 5거래일 종가 평균</b>이에요 (' +
          c.last5.map(function (p) { return md(p.d) + ' $' + p.c; }).join(' · ') + ' → <b>' + usd(c.star5) + '</b>).<br>' +
          '매수금은 <b>잔금 ÷ 4</b>(매도금 포함)이고, 매도는 <b>직전 보유 ÷ ' + (c.split === 20 ? 10 : 20) + '</b>(내림)이에요.<br>' +
          '종가가 <b>' + usd(c.exitPrice) + '</b>(평단 −' + c.target + '%)를 넘어서면 일반모드로 자동 복귀합니다.</div>';
      }
    } else if (!c.useUnit || !c.useAvg) {
      h += '<div class="note">원금과 평단이 있어야 주문을 계산해요. 회차 탭에서 <b>원금</b>을 넣어주세요.</div>';
    } else {
      if (c.half) {
        h += ordCard('b', 'LOC 매수', '별지점', c.useUnit / 2, c.star) +
          ordCard('b', 'LOC 매수', '평단', c.useUnit / 2, c.useAvg);
      } else {
        h += ordCard('b', 'LOC 매수', '별지점', c.useUnit, c.star);
      }
      var qq = Math.floor(c.usePosQ / 4);
      if (qq > 0) h += ordCard('s', 'LOC 매도 (쿼터)', '별지점', null, c.star, qq);
      var rest = c.usePosQ - qq;
      if (rest > 0) h += ordCard('s', '지정가 매도', '+' + c.target + '%', null, c.useAvg * (1 + c.target / 100), rest);
      h += ladder(c.useUnit, c.half ? Math.floor(c.useUnit / 2 / c.star) : Math.floor(c.useUnit / c.star));
    }
    h += '</div></section>';

    h += priceCard();
    h += '<section class="card"><div class="card-h"><h2>이번 회차</h2><div class="aside">' + c.rows.length + '일</div></div>' +
      '<div class="grid2">' +
      cell('매수 누적', usd(c.buyAmt)) + cell('보유 수량', qty(c.usePosQ) + '주') +
      cell('실현 손익', '<span class="' + cls(c.pnl) + '">' + usd(c.pnl, true) + '</span>') +
      cell('수수료', usd(c.fee)) + '</div></section>';

    return h + settingsCard() + backupBar();
  }
  function ladder(unit, firstQ) {          // +@ 폭락장 대비 추가 매수 = 매수금 ÷ (첫수량+1 …), 각 1주
    if (!unit) return '';
    var cnt = n(S.settings.ladderN) || 7, q0 = firstQ || 1;
    var h = '<div class="ladder"><div class="ladh">+@ 폭락장 대비 추가 매수</div>';
    for (var j = 1; j <= cnt; j++) {
      var n2 = q0 + j;
      h += '<div class="ladr"><span>LOC</span><b class="num">' + usd(Math.round(unit / n2 * 100) / 100) + '</b>' +
        '<span class="x num">× 1주</span><span class="dv num">÷' + n2 + '</span></div>';
    }
    return h + '</div>';
  }
  function lastClose(v) { return v.lastP ? v.lastP.c : null; }
  function tcell(k, val) { return '<div><div class="k">' + k + '</div><div class="v num">' + val + '</div></div>'; }
  function cell(k, val) { return '<div><div class="k">' + k + '</div><div class="v num">' + val + '</div></div>'; }
  function ordCard(side, kind, at, amount, price, fixedQ) {

      esc(kind) + '<span class="kind">' + esc(at) + '</span></div>' +
      '<div class="ordb"><span class="q num">' + qty(q) + '주</span><span class="at num">@ ' + usd(price) + '</span>' +
      '<span class="amt num">' + usd(q * (price || 0)) + '</span></div></div>';

  function settingsCard() {

      fld('분할수', 'settings', 0, 'split', S.settings.split, 'num', '40') +

      '<div class="note" style="margin-top:10px">무한매수법 <b>V4.0</b> 규칙이에요. <b>T > ' +
      ((n(S.settings.split) || 20) - 1) + '</b>이면 리버스모드로 자동 전환되고, 그때 별지점은 <b>직전 5거래일 종가 평균</b>이 됩니다 ' +

      '보유수량·평단·1회 투자금이 FIRE-GATE와 다르면 <b>회차 탭에서 직접 넣으세요</b> — 넣은 값이 우선합니다.</div>' +
      '</div></section>';
  }

  /* ------- 회차 ------- */
  function cycleTab(v) {
    var list = v.res.slice().reverse(), more = list.length - lim.cycle;

        (isOpen ? cycleEd(i, x) : '') + '</div>';

      '</section>' +
      '<div class="note" style="padding:0 4px">회차는 직접 넣으세요. <b>시작일과 종료일 사이의 매매</b>가 그 회차로 잡혀요. 종료일을 비워두면 진행 중인 회차가 됩니다.</div>';
    return h;
  }
  function cycleEd(i, x) {

    return '<div class="ed" data-stop="1">' +

      '<div class="fgrid f3">' +

      fld('수익률 %', 'cycles', i, 'rate', c.rate, 'num', x.rate === null ? '자동' : x.rate.toFixed(2)) +

      '<div class="fgrid f3">' +
      fld('보유수량 (수동)', 'cycles', i, 'posQ', c.posQ, 'num', x.posQ ? String(x.posQ) : '자동') +
      fld('평단 (수동)', 'cycles', i, 'avg', c.avg, 'num', x.avg ? x.avg.toFixed(2) : '자동') +
      fld('잔금 (수동)', 'cycles', i, 'left', c.left, 'num', x.leftAuto ? x.leftAuto.toFixed(2) : '자동') +
      fld('기준일 (수동값 시점)', 'cycles', i, 'asOf', c.asOf, 'date') +
      '<div class="note" style="padding:2px 2px 8px">보유수량·평단을 손으로 넣었다면 <b>그 값이 맞았던 날짜</b>를 기준일에 넣으세요. 기준일 <b>이후</b>의 매수·매도는 앱이 이어서 계산합니다. 기준일을 비우면 손으로 넣은 값이 그대로 고정돼요.</div>' +
      fld('1회 투자금', 'cycles', i, 'unit', c.unit, 'num', x.unit ? x.unit.toFixed(2) : '자동') +

      '<div class="fgrid f3">' +
      fld('T값 (수동)', 'cycles', i, 'tval', c.tval, 'num', x.Tauto === null ? '자동' : x.Tauto.toFixed(2)) +
      '<div></div><div></div></div>' +
      '<label class="f"><span>T값 갱신 (리버스모드)</span><div class="seg">' +

      '</div></label>' +

  function seg(i, val, label, cur, x) {

  /* ------- 매매 ------- */
  function logTab(v) {

  function tradeEd(i) {

      '<div class="edfoot"><button class="btn" data-close="1">닫기</button>' +
      delBtn('trades:' + i, pendingDel === 'trades:' + i) + '</div></div>';
  }
  function closeOf(d) { for (var i = 0; i < S.prices.length; i++) if (S.prices[i].d === d) return S.prices[i].c; return null; }
  function fsumText(s2) { return s2.q ? qty(s2.q) + '주 · 평균 ' + usd(s2.avg) + (s2.fee ? ' · 수수료 ' + usd(s2.fee) : '') : '입력 없음'; }
  function fills(i, key, label, list) {
    var rows = Math.max(3, (list || []).length), h = '<div class="fillbox"><div class="fillhead">' + label + ' 체결</div>';
    for (var j = 0; j < rows; j++) {
      var x = (list || [])[j] || {};
      h += '<div class="fillrow"><span class="no">' + (j + 1) + '</span>' +
        sub(i, key, j, 'p', x.p, '단가') + sub(i, key, j, 'q', x.q, '수량') + sub(i, key, j, 'f', x.f, '수수료') + '</div>';

      '<b class="num">' + (s2.q ? usd(s2.amt) : '') + '</b></div></div>';
    return h;
  }
  function sub(i, key, j, s2, val, ph) {
    return '<input inputmode="decimal" data-k="trades" data-i="' + i + '" data-f="' + key + '" data-j="' + j +
      '" data-sub="' + s2 + '" value="' + esc(val === null || val === undefined ? '' : val) + '" placeholder="' + ph + '" aria-label="' + ph + '">';
  }

  /* ------- 월별 ------- */
  function monthTab(v) {
    var h = '<section class="hero"><div class="lab">누적 실현 손익</div>' +
      '<div class="big num ' + cls(v.totalPnl) + '">' + usd(v.totalPnl, true) + '</div>' +
      '<div class="sub num">' + krw(v.totalKRW, true) + '</div>' +
      '<div class="grid2">' + cell('종료 회차', v.res.filter(function (x) { return !x.open; }).length + '회') +
      cell('현재 환율', (n(S.settings.fxNow) || 0).toLocaleString('ko-KR')) + '</div></section>';
    h += '<section class="card"><div class="card-h"><h2>월별 실현손익</h2></div><div class="rows">';
    if (!v.months.length) h += '<div class="empty">아직 종료된 회차가 없어요.</div>';
    v.months.slice().reverse().forEach(function (m) {
      var y = m.k.split('-');
      h += '<div class="row" style="grid-template-columns:1fr auto">' +
        '<div><div style="font-weight:600;font-size:13.5px">' + y[0] + '년 ' + (+y[1]) + '월</div>' +
        '<div style="font-size:11.5px;color:var(--ink-3)">' + m.n + '회차 종료</div></div>' +
        '<div style="text-align:right"><div class="num ' + cls(m.usd) + '" style="font-weight:600">' + usd(m.usd, true) + '</div>' +
        '<div class="num" style="font-size:11.5px;color:var(--ink-3)">' + krw(m.usd * (n(S.settings.fxNow) || 0), true) + '</div></div></div>';
    });
    h += '</div></section>';
    h += '<section class="card"><div class="card-h"><h2>회차별 수익률</h2></div><div class="rows">';
    v.res.filter(function (x) { return !x.open; }).slice().reverse().forEach(function (x) {
      h += '<div class="row" style="grid-template-columns:auto 1fr auto">' +
        '<div style="font-weight:600;font-size:13px">' + (x.c.no || '?') + '회</div>' +
        '<div class="num" style="font-size:11.5px;color:var(--ink-3);text-align:right">' + (x.dur === null ? '' : x.dur + '일') + '</div>' +
        '<div class="num ' + cls(x.rate) + '" style="font-weight:600;min-width:66px;text-align:right">' + pct(x.rate, true) + '</div></div>';
    });
    h += '</div></section>';
    return h;
  }

  /* ------- 입력 필드 ------- */
  function fld(label, k, i, f, val, type, ph) {
    var attrs = type === 'date' ? 'type="date" class="txt"' : (type === 'text' ? 'type="text" class="txt"' : 'inputmode="decimal"');
    return '<label class="f"><span>' + label + '</span><input ' + attrs + ' data-k="' + k + '" data-i="' + i +
      '" data-f="' + f + '" value="' + esc(val === null || val === undefined ? '' : val) + '" placeholder="' + esc(ph || '') + '"></label>';
  }

  function applyCalc(v) {
    Array.prototype.forEach.call(app.querySelectorAll('[data-fsum]'), function (el) {
      var q = el.dataset.fsum.split(':'), tt2 = S.trades[+q[0]];
      var s2 = roll(tt2 && tt2[q[1]]);
      el.firstChild.textContent = fsumText(s2);
      el.lastChild.textContent = s2.q ? usd(s2.amt) : '';
    });
    var hv = document.querySelector('.hd-total .v');
    if (hv) { hv.textContent = usd(v.totalPnl, true); hv.className = 'v num ' + cls(v.totalPnl); }
  }

  /* ------- 이벤트 ------- */
  var reRender = null;
  app.addEventListener('input', function (e) {
    var el = e.target; if (!el.dataset || !el.dataset.k) return;
    var k = el.dataset.k, i = +el.dataset.i, f = el.dataset.f, val = el.value;
    if (k === 'close') {
      var tr = S.trades[i]; if (!tr) return;
      var px = null;
      for (var z2 = 0; z2 < S.prices.length; z2++) if (S.prices[z2].d === tr.d) { px = S.prices[z2]; break; }
      if (!px) { px = { d: tr.d, c: null }; S.prices.push(px); }
      px.c = n(val); markDirty(); applyCalc(derive()); return;
    }
    var obj = k === 'settings' ? S.settings : S[k][i];
    if (!obj) return;
    if (f === 'buys' || f === 'sells') {
      var j = +el.dataset.j, s2 = el.dataset.sub, arr = obj[f] = obj[f] || [];
      while (arr.length <= j) arr.push({});
      if (val === '') delete arr[j][s2]; else arr[j][s2] = n(val);
      markDirty(); applyCalc(derive()); return;
    }
    if (['note', 'ticker', 'broker', 'd', 'ad', 'start', 'end', 'revStart', 'asOf'].indexOf(f) >= 0) obj[f] = val;
    else obj[f] = n(val);
    if (val === '') delete obj[f];
    markDirty();
    if (k === 'prices') {                       // 종가를 고치면 잠깐 뒤 화면 전체를 다시 계산
      var sel = '[data-k="prices"][data-i="' + i + '"][data-f="' + f + '"]';
      var cp = null; try { cp = el.selectionStart; } catch (x) {}
      clearTimeout(reRender);
      reRender = setTimeout(function () {
        render();
        var e2 = app.querySelector(sel);
        if (e2) { e2.focus(); if (cp !== null) { try { e2.setSelectionRange(cp, cp); } catch (x) {} } }
      }, 800);
      return;
    }
    if (k === 'settings' || f === 'seed' || f === 'start' || f === 'end') {
      clearTimeout(reRender); reRender = setTimeout(function () { applyCalc(derive()); }, 10);
    } else applyCalc(derive());
  });

  app.addEventListener('click', function (e) {
    var t = e.target.closest('[data-tab],[data-add],[data-del],[data-close],[data-open],[data-openc],[data-more],[data-mode],[data-tstep],[data-fill],[data-lag],#savebtn');
    if (!t) return;
    if (pendingDel && t.dataset.del !== pendingDel) { pendingDel = null; render(); }
    if (t.id === 'savebtn') { save(); return; }
    if (t.dataset.tab) { tab = t.dataset.tab; open = null; openC = null; render(); window.scrollTo(0, 0); return; }
    if (t.dataset.more) { lim[t.dataset.more] += 40; render(); return; }
    if (t.dataset.lag !== undefined) {
      S.settings.starLag = +t.dataset.lag ? 1 : 0;
      markDirty(); render();
      toast(+t.dataset.lag ? '별지점: 최신 종가를 빼고 계산해요.' : '별지점: 최신 종가까지 넣어 계산해요.');
      return;
    }
    if (t.dataset.fill) {
      var fd = t.dataset.fill, pi = null;
      for (var q3 = 0; q3 < S.prices.length; q3++) if (S.prices[q3].d === fd) { pi = q3; break; }
      if (pi === null) { S.prices.push({ d: fd, c: null }); pi = S.prices.length - 1; markDirty(); }
      tab = 'today'; open = null; openC = null; pendingDel = null;
      render();
      var fel = app.querySelector('input.pin[data-i="' + pi + '"]');
      if (fel) { fel.scrollIntoView({ block: 'center' }); fel.focus(); }
      return;
    }
    if (t.dataset.add === 'price') {
      var pd = lastUsDate(), mxd = null;
      S.prices.forEach(function (p) { if (p.d && (mxd === null || p.d > mxd)) mxd = p.d; });
      if (mxd !== null && mxd >= pd) pd = nextWk(mxd);
      while (S.prices.some(function (p) { return p.d === pd; })) pd = nextWk(pd);
      S.prices.push({ d: pd, c: null });
      var ni = S.prices.length - 1;
      markDirty(); render();
      var pel = app.querySelector('input.pin[data-i="' + ni + '"]');
      if (pel) { pel.scrollIntoView({ block: 'center' }); pel.focus(); }
      toast('날짜를 확인하고 종가를 입력하세요.');
      return;
    }
    if (t.dataset.tstep) {
      var tp = t.dataset.tstep.split(':'), tc = S.cycles[+tp[0]];
      if (tc) {
        var sp2 = n(S.settings.split) || 20;
        var v2 = derive(), xx = null;
        v2.res.forEach(function (r2) { if (r2.c === tc) xx = r2; });
        var cur2 = xx && xx.T !== null ? xx.T : null;
        if (tp[1] === 'clear') { delete tc.tval; toast('T값을 자동 계산으로 되돌렸어요.'); }
        else if (cur2 === null) { toast('T값이 아직 없어요. 원금을 먼저 넣어 주세요.'); return; }
        else if (tp[1] === 'sell') { tc.tval = Math.round(cur2 * (sp2 === 20 ? 0.9 : 0.95) * 100000) / 100000; toast('매도 반영 → T ' + tc.tval.toFixed(2)); }
        else { tc.tval = Math.round((cur2 + (sp2 - cur2) * 0.25) * 100000) / 100000; toast('매수 반영 → T ' + tc.tval.toFixed(2)); }
        markDirty(); render();
      }
      return;
    }
    if (t.dataset.mode !== undefined) {
      var mp = t.dataset.mode.split(':'), cc = S.cycles[+mp[0]];
      if (cc) { if (mp[1]) cc.mode = mp[1]; else delete cc.mode; markDirty(); render(); }
      return;
    }
    if (t.dataset.close !== undefined) { open = null; openC = null; pendingDel = null; render(); return; }
    if (t.dataset.del) {
      var key = t.dataset.del;
      if (pendingDel !== key) { pendingDel = key; render(); toast('한 번 더 누르면 삭제돼요.'); return; }
      var p = key.split(':');
      S[p[0]].splice(+p[1], 1);
      pendingDel = null; open = null; openC = null; markDirty(); render();
      toast('삭제했어요. 저장을 눌러야 앱에 반영돼요.'); return;
    }
    if (t.dataset.add === 'trade') {
      var d = lastUsDate();
      while (S.trades.some(function (x) { return x.d === d; })) d = shift(d, 1);
      S.trades.push({ d: d, ad: krDate(d), fx: n(S.settings.fxNow) || n(S.settings.fxDefault) || null, buys: [], sells: [] });
      open = S.trades.length - 1; markDirty(); render();
      var el2 = app.querySelector('.ed input'); if (el2) el2.focus(); return;
    }
    if (t.dataset.add === 'cycle') {
      var mx = 0; S.cycles.forEach(function (c) { mx = Math.max(mx, n(c.no) || 0); });
      var lastSeed = null; S.cycles.forEach(function (c) { if (c.seed) lastSeed = c.seed; });
      S.cycles.push({ no: mx + 1, start: lastUsDate(), end: null, seed: lastSeed, rate: null, pnl: null, note: '' });
      openC = S.cycles.length - 1; markDirty(); render();
      var el3 = app.querySelector('.ed input'); if (el3) el3.focus(); return;
    }
    if (t.dataset.open !== undefined && !e.target.closest('[data-stop]')) {
      var idx = +t.dataset.open; open = open === idx ? null : idx; openC = null; render(); return;
    }
    if (t.dataset.openc !== undefined && !e.target.closest('[data-stop]')) {
      var idc = +t.dataset.openc; openC = openC === idc ? null : idc; open = null; render(); return;
    }
  });

  /* ------- 백업 ------- */
  function backupBar() {
    return '<section class="card"><div class="card-h"><h2>백업</h2></div><div class="card-b">' +
      '<div class="bkbar">' +
      '<button class="btn wide" data-bk="out">기록 내보내기</button>' +
      '<button class="btn wide" data-bk="in">기록 불러오기</button>' +
      '</div>' +
      '<div class="note" style="margin-top:9px">기록은 <b>이 기기(브라우저)에만</b> 저장돼요. 폰을 바꾸거나 브라우저 데이터를 지우면 사라지니, 가끔 <b>내보내기</b>로 파일을 받아 두세요. 새 기기에서는 <b>불러오기</b>로 그 파일을 넣으면 그대로 복구됩니다.</div>' +
      '</div></section>';
  }
  function doExport() {
    try {
      var name = BKNAME + '-' + today() + '.json';
      var blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
      toast(name + ' 로 내려받았어요.');
    } catch (e) { toast('내보내기에 실패했어요.'); }
  }
  function doImport() {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'application/json,.json';
    inp.onchange = function () {
      var f = inp.files && inp.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(String(fr.result));
          if (!d || typeof d !== 'object' || !d.settings) throw 0;
          S = d;
          S.settings = S.settings || {};
          S.prices = S.prices || []; S.trades = S.trades || [];
          if (S.rounds === undefined) S.rounds = [];
          if (S.cycles === undefined) S.cycles = [];
          markDirty(); render(); pullPrices();
          toast('불러왔어요. 기록 ' + (S.trades.length) + '건.');
        } catch (e) { toast('파일을 읽지 못했어요. 내보내기로 받은 json 파일인지 확인해 주세요.'); }
      };
      fr.readAsText(f);
    };
    inp.click();
  }

  /* ------- 종가 자동 수신 ------- */
  function pullPrices() {
    if (!window.fetch) return;
    fetch('prices.json?t=' + Date.now()).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j) return;
        var map = {}, added = 0;
        S.prices.forEach(function (p) { if (p && p.d) map[p.d] = p; });
        (j.prices || []).forEach(function (x) {
          if (!x || !x.d || x.c === null || x.c === undefined || x.c === '') return;
          var e = map[x.d];
          if (!e) { S.prices.push({ d: x.d, c: x.c }); added++; }
          else if (e.c === null || e.c === undefined || e.c === '') { e.c = x.c; added++; }
        });
        var fxNew = false, fx = +j.fx;
        if (fx && isFinite(fx)) {
          if (n(S.settings[FXKEY]) !== fx) { S.settings[FXKEY] = fx; fxNew = true; }
        }
        if (added || fxNew) {
          try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
          render();
          toast(added ? ('종가 ' + added + '일치를 자동으로 받았어요.') : ('환율을 ' + fx.toLocaleString('ko-KR') + '원으로 갱신했어요.'));
        }
      })['catch'](function () {});
  }

  app.addEventListener('click', function (e) {
    var t = e.target.closest('[data-bk]');
    if (!t) return;
    if (t.dataset.bk === 'out') doExport(); else doImport();
  });

  render();
  pullPrices();
})();
</script>
<script>(new Function(document.getElementById("code").textContent))();</script>
</body>
