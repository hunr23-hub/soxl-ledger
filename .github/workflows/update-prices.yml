name: 종가·환율 자동 갱신

on:
  schedule:
    - cron: "10 22 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 종가·환율 받아오기
        run: python scripts/fetch_prices.py

      - name: 바뀌었으면 커밋
        run: |
          if git diff --quiet -- prices.json; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -m "종가·환율 갱신 $(date -u +%Y-%m-%d)"
          git push
