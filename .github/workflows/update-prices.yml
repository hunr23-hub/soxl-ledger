name: 종가·환율 자동 갱신

on:
  schedule:
    # 평일 07:00 KST (= 전날 22:00 UTC)
    - cron: "0 22 * * 0-4"
    # 예비: 평일 09:00 KST — 7시에 조회가 실패했을 때만 의미가 있고,
    # 이미 최신이면 커밋하지 않고 그냥 끝난다.
    - cron: "0 0 * * 1-5"
  workflow_dispatch:        # 탭에서 손으로 돌릴 수도 있게

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 종가·환율 받아오기
        run: python scripts/fetch_prices.py

      - name: 바뀌었으면 커밋
        run: |
          if git diff --quiet -- prices.json; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -m "종가·환율 갱신 $(date -u +%Y-%m-%d)"
          git push
