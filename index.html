<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EFF1F3">
<title>SOXL 매매장부</title>
<link rel="icon" href="icon-soxl.png">
<link rel="apple-touch-icon" href="icon-soxl.png">
<meta name="apple-mobile-web-app-title" content="SOXL 장부">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap');

:root{
  --bg:#EFF1F3; --surface:#FFFFFF; --surface-2:#F6F7F9; --surface-3:#EAEDF1;
  --ink:#16181C; --ink-2:#59606A; --ink-3:#888F99;
  --line:#DCE0E6; --line-2:#E9ECF0;
  --brass:#8A6A1F; --brass-2:#A98436; --brass-bg:#F4EDDD;
  --up:#C4362D; --up-bg:#FAEBE9;
  --down:#2A61BC; --down-bg:#E8EFFA;
  --flat:#7A828C;
  --shadow:0 1px 2px rgba(16,20,28,.06), 0 4px 14px rgba(16,20,28,.05);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1114; --surface:#181B20; --surface-2:#1F232A; --surface-3:#262B33;
    --ink:#E6E9ED; --ink-2:#99A1AB; --ink-3:#6D757F;
    --line:#272C34; --line-2:#20242B;
    --brass:#D8AC57; --brass-2:#E4BE72; --brass-bg:#2A2213;
    --up:#EE6157; --up-bg:#2A1715;
    --down:#5E9CF2; --down-bg:#131E2E;
    --flat:#767E88;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1114; --surface:#181B20; --surface-2:#1F232A; --surface-3:#262B33;
  --ink:#E6E9ED; --ink-2:#99A1AB; --ink-3:#6D757F;
  --line:#272C34; --line-2:#20242B;
  --brass:#D8AC57; --brass-2:#E4BE72; --brass-bg:#2A2213;
  --up:#EE6157; --up-bg:#2A1715;
  --down:#5E9CF2; --down-bg:#131E2E;
  --flat:#767E88;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}

/* ---------- shell ---------- */
.shell{max-width:620px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
header{
  position:sticky;top:0;z-index:20;background:var(--surface);
  border-bottom:1px solid var(--line);
  padding:10px 16px 9px;display:flex;align-items:center;gap:12px;
}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand b{font-size:14px;font-weight:600;letter-spacing:.02em}
.brand span{font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.hd-total{margin-left:auto;text-align:right;line-height:1.2}
.hd-total .v{font-size:15px;font-weight:600}
.hd-total .s{font-size:11px;color:var(--ink-3)}
.savebtn{
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);
  border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:500;cursor:pointer;
  white-space:nowrap;transition:background .15s,border-color .15s,color .15s;
}
.savebtn:hover{background:var(--surface-3)}
.savebtn[data-dirty="1"]{background:var(--brass);border-color:var(--brass);color:#fff}
.savebtn:disabled{opacity:.55;cursor:default}
.savebtn:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--brass-2);outline-offset:2px}

main{flex:1;padding:14px 14px 26px;display:flex;flex-direction:column;gap:14px}

nav{
  position:sticky;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  background:none;border:0;padding:9px 0 10px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11.5px;color:var(--ink-3);border-top:2px solid transparent;margin-top:-1px;
}
nav button .ic{width:19px;height:19px;display:block}
nav button[aria-current="true"]{color:var(--brass);border-top-color:var(--brass);font-weight:600}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:baseline;gap:8px;padding:13px 15px 0}
.card-h h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.card-h .aside{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
.card-b{padding:12px 15px 14px}

/* hero summary */
.hero{padding:18px 16px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.hero .lab{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.hero .big{font-size:34px;font-weight:600;line-height:1.05;margin-top:5px;letter-spacing:-.02em}
.hero .sub{margin-top:3px;font-size:15px;font-weight:500}
.hero .krw{margin-top:9px;font-size:13.5px;color:var(--ink-2)}
.fxbox{margin-top:12px;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.fxbox > div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 12px;border-top:1px solid var(--line-2);font-size:13px}
.fxbox > div:first-child{border-top:0}
.fxbox span{color:var(--ink-2);font-size:12.5px}
.fxbox b{font-weight:600}
.fxbox .tot{background:var(--surface-2)}
.fxbox .tot span{color:var(--ink);font-weight:600;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-2);border-radius:11px;overflow:hidden;margin-top:15px}
.grid2 div{background:var(--surface-2);padding:10px 12px}
.grid2 .k{font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.grid2 .v{font-size:14.5px;font-weight:600;margin-top:2px;line-height:1.3}

/* chart */
.chartwrap{padding:6px 8px 2px}
svg.chart{display:block;width:100%;height:170px;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .zero{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 3;opacity:.7}
.chart .ln{fill:none;stroke:var(--brass);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--brass);opacity:.11}
.chart .dot{fill:var(--brass)}
.chart text{font-family:'IBM Plex Mono',monospace;font-size:9.5px;fill:var(--ink-3)}

/* rows / tables */
.rows{display:flex;flex-direction:column}
.row{display:grid;align-items:center;gap:8px;padding:9px 15px;border-top:1px solid var(--line-2)}
.row:first-child{border-top:0}
.rowhead{display:grid;gap:8px;padding:7px 15px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2);border-bottom:1px solid var(--line)}
.p-cols{grid-template-columns:minmax(0,1fr) 62px 62px 54px 30px}
.row.p-cols input.pdate{border:0;background:none;padding:0;font-family:inherit;width:100%;min-width:0;color:var(--ink)}
.row.p-cols input.pin{border:0;background:none;padding:3px 4px;width:100%;min-width:0;text-align:right;font-family:inherit;font-weight:600;font-size:12.5px;color:var(--ink);border-radius:5px}
.row.p-cols input.pin::placeholder{color:var(--brass);font-weight:500;opacity:1;font-size:11px}
.row.p-cols input.pin:placeholder-shown{background:var(--brass-bg);box-shadow:inset 0 0 0 1px var(--brass-2)}
.row.p-cols input.pin:focus{outline:0;background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--brass)}
.xdel{border:0;background:none;color:var(--ink-3);font-size:17px;line-height:1;padding:4px 0;width:100%;border-radius:6px;cursor:pointer;font-family:inherit;-webkit-appearance:none}
.xdel.arm{background:var(--up);color:#fff;font-size:10.5px;font-weight:700;padding:6px 0}
.fillbar{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 12px;padding:13px 15px;border:1px solid var(--brass-2);background:var(--brass-bg);color:var(--brass);border-radius:var(--r);font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;text-align:left}
.fillbar .fb-a{margin-left:auto;font-weight:500;opacity:.85;white-space:nowrap}
.row.p-cols{font-size:12.5px;padding-left:13px;padding-right:13px}
.rowhead.p-cols{padding-left:13px;padding-right:13px}
.row.p-cols input::-webkit-calendar-picker-indicator{opacity:.45;padding:0;margin:0;width:13px}
.row.p-cols input[type=date]{font-size:12.5px}
.rowhead.p-cols div:not(:first-child),.row.p-cols>*:not(:first-child){text-align:right}
.tl-cols{grid-template-columns:1fr auto}

/* trade card */
.tcard{border-top:1px solid var(--line-2);padding:11px 15px;cursor:pointer}
.tcard:first-child{border-top:0}
.tcard[aria-expanded="true"]{background:var(--surface-2);cursor:default}
.tcard .l1{display:flex;align-items:baseline;gap:9px}
.tcard .dt{font-size:13px;font-weight:600}
.tcard .cl{font-size:12.5px;color:var(--ink-2)}
.tcard .kr{font-size:11px;color:var(--ink-3);letter-spacing:.01em}
.tcard .chg{margin-left:auto;font-size:12.5px;font-weight:600}
.tcard .l2{display:flex;align-items:baseline;gap:7px;margin-top:5px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.tag{font-size:10.5px;padding:2px 6px;border-radius:5px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.tag.b{background:var(--up-bg);color:var(--up)}
.tag.s{background:var(--down-bg);color:var(--down)}
.tag.n{background:var(--surface-3);color:var(--ink-3)}
.tag.w{background:var(--brass-bg);color:var(--brass)}
.pnl{margin-left:auto;font-size:13px;font-weight:600}

/* editor */
.ed{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:10px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fgrid.f3{grid-template-columns:1fr 1fr 1fr}
label.f{display:flex;flex-direction:column;gap:4px;min-width:0}
label.f > span{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
label.f input{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:8px 9px;font-size:14px;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;
}
label.f input[type=date],label.f input.txt{font-family:inherit}
label.f input::placeholder{color:var(--ink-3);opacity:.7}
.derived{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-2);border-radius:10px;overflow:hidden}
.derived div{background:var(--surface);padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.derived .k{font-size:10.5px;letter-spacing:.05em;color:var(--ink-3);white-space:nowrap}
.derived .v{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edfoot{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 13px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--brass);border-color:var(--brass);color:#fff;font-weight:600}
.btn.dan{color:var(--up);border-color:var(--up-bg)}
.btn.dan.arm{background:var(--up);border-color:var(--up);color:#fff;font-weight:600}
.btn.wide{width:100%;justify-content:center;text-align:center}
.edfoot .btn.dan{margin-left:auto}

.addbar{padding:11px 15px;border-top:1px solid var(--line-2)}
.addbar.top{border-top:0;border-bottom:1px solid var(--line-2);padding-top:12px}

.note{font-size:12px;color:var(--ink-2);line-height:1.55}
.warn{background:var(--brass-bg);border:1px solid color-mix(in srgb,var(--brass) 30%,transparent);border-radius:11px;padding:11px 13px;font-size:12.5px;color:var(--ink)}
.warn b{color:var(--brass);font-weight:600}
.warn ul{margin:6px 0 0;padding-left:17px} .warn li{margin:2px 0}
.empty{padding:26px 15px;text-align:center;color:var(--ink-3);font-size:13px}
.toast{
  position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(8px);
  background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:10px;font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;box-shadow:var(--shadow);
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.tcard .rl{margin-left:auto;text-align:right}
.morebar{padding:0 15px 13px}

/* 체결 입력 */
.fillbox{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface)}
.fillhead{padding:7px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);
  font-size:10.5px;letter-spacing:.09em;color:var(--ink-3);font-weight:600}
.fillrow{display:grid;grid-template-columns:14px 1fr 0.82fr 0.9fr;gap:6px;align-items:center;
  padding:6px 10px 6px 7px;border-top:1px solid var(--line-2)}
.fillbox .fillrow:first-of-type{border-top:0}
.fillrow .no{font-size:11px;color:var(--ink-3);text-align:center;
  font-family:'IBM Plex Mono',ui-monospace,monospace}
.fillrow input{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);
  border-radius:8px;padding:7px 7px;font-size:13px;
  font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.fillrow input::placeholder{font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;
  color:var(--ink-3);opacity:.7;font-size:11.5px}
.fsum{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  padding:8px 12px;background:var(--surface-2);border-top:1px solid var(--line-2);
  font-size:12px;color:var(--ink-2)}
.fsum b{font-weight:600;color:var(--ink);font-size:13px}
.fillrow.feerow{border-top:1px solid var(--line)}

.bkbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<div id="app"></div>
<script id="state" type="application/json">{"settings":{"ticker":"SOXL","startUSD":null,"fxDefault":null,"fxCost":null},"prices":[],"trades":[],"rounds":[],"savedAt":null}</script>
<script id="code" type="text/plain">
/* SOXL 매매장부 — 개인 기록 앱 */
(function () {
  'use strict';

  var LS = 'soxl-ledger-v1';
  var S = JSON.parse(document.getElementById('state').textContent);
  S.settings = S.settings || {};
  S.prices = S.prices || []; S.trades = S.trades || []; S.rounds = S.rounds || [];
  S.trades.forEach(function (t) {                       // 예전 단일 체결 형식 호환
    if (!t.buys) { t.buys = (t.bp !== undefined && t.bq) ? [{ p: t.bp, q: t.bq }] : []; }
    if (!t.sells) { t.sells = (t.sp !== undefined && t.sq) ? [{ p: t.sp, q: t.sq }] : []; }
    delete t.bp; delete t.bq; delete t.sp; delete t.sq;
    if (t.feeB !== undefined) { if (t.buys[0]) t.buys[0].f = t.feeB; delete t.feeB; }
    if (t.feeS !== undefined) { if (t.sells[0]) t.sells[0].f = t.feeS; delete t.feeS; }
    if (t.fee !== undefined) {
      if (t.sells[0]) t.sells[0].f = t.fee; else if (t.buys[0]) t.buys[0].f = t.fee;
      delete t.fee;
    }
  });

  // 로컬 임시본이 더 최신이면 그것부터 복원
  var dirty = false;
  try {
    var raw = localStorage.getItem(LS);
    if (raw) {
      var d = JSON.parse(raw);
      if (d && d.savedAt && new Date(d.savedAt) > new Date(S.savedAt || 0)) { S = d; }
    }
  } catch (e) {}

  var tab = 'home';
  var open = null;              // 펼쳐진 매매 카드 인덱스
  var openR = null;             // 펼쳐진 차수 카드 인덱스
  var lim = { log: 25, price: 25, round: 15 };
  var pendingDel = null;        // 삭제 확인 대기 ('rounds:3' 등)
  var app = document.getElementById('app');
  var BKNAME = 'soxl-ledger', FXKEY = 'fxDefault';

  /* ---------------- 유틸 ---------------- */
  function n(v) { if (v === null || v === undefined || v === '') return null; var x = +String(v).replace(/[,\s$₩%]/g, ''); return isFinite(x) ? x : null; }
  function usd(v, sign) { if (v === null || v === undefined || !isFinite(v)) return '—'; var s = v < 0 ? '-' : (sign && v > 0 ? '+' : ''); return s + '$' + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function krw(v, sign) { if (v === null || v === undefined || !isFinite(v)) return '—'; var s = v < 0 ? '-' : (sign && v > 0 ? '+' : ''); return s + '₩' + Math.round(Math.abs(v)).toLocaleString('ko-KR'); }
  function pct(v, sign) { if (v === null || v === undefined || !isFinite(v)) return '—'; var s = v < 0 ? '-' : (sign && v > 0 ? '+' : ''); return s + Math.abs(v).toFixed(2) + '%'; }
  function qty(v) { if (v === null || v === undefined || !isFinite(v)) return '—'; return v.toLocaleString('ko-KR', { maximumFractionDigits: 4 }); }
  function cls(v) { return v === null || v === undefined || !isFinite(v) || v === 0 ? 'flat' : (v > 0 ? 'up' : 'down'); }
  function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function md(s) { if (!s) return '—'; var p = s.split('-'); return p.length === 3 ? (+p[1]) + '/' + (+p[2]) : s; }
  function today() { var t = new Date(Date.now() + 9 * 3600e3); return t.toISOString().slice(0, 10); }  // 국내(KST) 오늘
  function shift(d, k) { var x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + k); return x.toISOString().slice(0, 10); }
  function krDate(d) { return d ? shift(d, 1) : null; }        // 미국 종가날짜 → 그 장이 끝난 국내 날짜
  function lastUsDate() {                                       // 국내 오늘 새벽에 끝난 미국장 날짜
    var d = shift(today(), -1);
    while ([0, 6].indexOf(new Date(d + 'T00:00:00Z').getUTCDay()) >= 0) d = shift(d, -1);
    return d;
  }
  function nextWk(d) { var x = shift(d, 1); while ([0, 6].indexOf(new Date(x + 'T00:00:00Z').getUTCDay()) >= 0) x = shift(x, 1); return x; }
  function byDate(a, b) { return a.d < b.d ? -1 : a.d > b.d ? 1 : 0; }
  function missingClose() {                   // 가장 최근 미국 거래일 중 종가가 비어 있는 날
    var d = lastUsDate();
    for (var i = 0; i < 6; i++) {
      var hit = null;
      for (var j = 0; j < S.prices.length; j++) if (S.prices[j].d === d) { hit = S.prices[j]; break; }
      if (!hit || hit.c === null || hit.c === undefined || hit.c === '') return d;
      d = shift(d, -1);
      while ([0, 6].indexOf(new Date(d + 'T00:00:00Z').getUTCDay()) >= 0) d = shift(d, -1);
    }
    return null;
  }
  function roll(list) {                       // 체결들 → {수량합, 금액합, 수수료합, 가중평균}
    var q = 0, amt = 0, fee = 0;
    (list || []).forEach(function (x) {
      var p = n(x.p), qq = n(x.q);
      if (p !== null && qq) { q += qq; amt += p * qq; }
      fee += n(x.f) || 0;
    });
    return { q: q, amt: amt, fee: fee, avg: q ? amt / q : null };
  }

  /* ---------------- 계산 ---------------- */
  function derive() {
    var prices = S.prices.slice().sort(byDate);
    var pmap = {}, pchg = {};
    prices.forEach(function (p, i) {
      pmap[p.d] = p.c;
      var pv = null;                                  // 바로 위 '종가가 있는' 날과 비교 (빈 줄·연휴 건너뜀)
      for (var w = i - 1; w >= 0; w--) { if (prices[w].c !== null && prices[w].c !== undefined && prices[w].c !== '') { pv = prices[w].c; break; } }
      pchg[p.d] = (pv !== null && p.c !== null && p.c !== undefined && p.c !== '') ? { $: p.c - pv, '%': pv ? (p.c - pv) / pv * 100 : null } : { $: null, '%': null };
    });

    var trades = S.trades.slice().sort(byDate);
    var defFx = n(S.settings.fxDefault);
    var posQ = 0, posAvg = 0, posAvgNF = 0, cum = 0, krwCum = 0, warn = [];  // NF = 수수료 제외(증권사 평균단가 기준)
    var out = [];
    trades.forEach(function (t) {
      var r = { t: t, d: t.d, close: pmap[t.d] === undefined ? null : pmap[t.d] };
      r.chg = pchg[t.d] || { $: null, '%': null };
      var B = roll(t.buys), SS = roll(t.sells);
      var bp = B.avg, bq = B.q, sp = SS.avg, sq = SS.q, fx = n(t.fx);
      r.bp = bp; r.bq = bq; r.sp = sp; r.sq = sq;
      var feeB = B.fee, feeS = SS.fee;
      r.buyAmt = bq ? B.amt : null;
      if (r.buyAmt !== null) {
        posAvg = (posAvg * posQ + r.buyAmt + feeB) / (posQ + bq);
        posAvgNF = (posAvgNF * posQ + r.buyAmt) / (posQ + bq);
        posQ += bq;
      }
      r.avgBefore = posAvg;
      r.sellAmt = null; r.pnl = null; r.net = null; r.rate = null; r.cost = null;
      if (sq) {
        r.sellAmt = SS.amt;
        var held = Math.min(sq, posQ);          // 원가를 아는 만큼만 손익 인식
        r.unmatched = sq - held;
        if (r.unmatched > 1e-9) {
          warn.push({ d: t.d, sq: sq, posQ: posQ, un: r.unmatched });
        }
        if (held > 1e-9) {
          r.matched = held;
          r.cost = posAvg * held;
          r.pnl = sp * held - r.cost;
          r.net = r.pnl - feeS;
          r.rate = r.cost ? r.net / r.cost * 100 : null;
          cum += r.net;
        }
        posQ = Math.max(0, posQ - sq);
        if (posQ < 1e-9) { posQ = 0; posAvg = 0; posAvgNF = 0; }
      }
      var efx = fx || defFx;                  // 환율 미입력 행은 기본 환율로
      r.feeB = feeB; r.feeS = feeS; r.fx = fx; r.efx = efx; r.fxDefaulted = !fx && !!defFx;
      r.posQ = posQ; r.posAvg = posAvg; r.posAvgNF = posAvgNF;
      r.cum = cum;
      if (r.net !== null && efx) { r.netKRW = r.net * efx; krwCum += r.netKRW; }  // 그날 환율로 환산해 누적
      else { r.netKRW = null; }
      r.cumKRW = krwCum;
      out.push(r);
    });

    // 월별
    var mo = {}, order = [];
    out.forEach(function (r) {
      if (r.net === null) return;
      var k = r.d.slice(0, 7);
      if (!mo[k]) { mo[k] = { k: k, usd: 0, krw: 0, win: 0, lose: 0 }; order.push(k); }
      mo[k].usd += r.net;
      if (r.netKRW !== null) mo[k].krw += r.netKRW;
      if (r.net >= 0) mo[k].win++; else mo[k].lose++;
    });

    var start = n(S.settings.startUSD) || 0;
    var last = out.length ? out[out.length - 1] : null;
    var lastP = null;                                   // 평가는 '가장 최근 종가' 기준
    for (var z = prices.length - 1; z >= 0; z--) { if (prices[z].c) { lastP = prices[z]; break; } }
    var lastFx = null;
    for (var i = out.length - 1; i >= 0; i--) { if (out[i].efx) { lastFx = out[i].efx; break; } }

    var closed = out.filter(function (r) { return r.net !== null; });
    var wins = closed.filter(function (r) { return r.net >= 0; }).length;

    return {
      prices: prices, pmap: pmap, pchg: pchg, rows: out,
      months: order.map(function (k) { return mo[k]; }),
      warn: warn,
      sum: {
        cum: cum, start: start,
        roi: start ? cum / start * 100 : null,
        tradeKRW: krwCum,
        fxCost: n(S.settings.fxCost),
        fxPnl: (n(S.settings.fxCost) && lastFx) ? (start + cum) * (lastFx - n(S.settings.fxCost)) : null,
        krw: krwCum + ((n(S.settings.fxCost) && lastFx) ? (start + cum) * (lastFx - n(S.settings.fxCost)) : 0),
        fx: lastFx,
        posQ: posQ, posAvg: posAvg, posAvgNF: posAvgNF,
        posValue: (lastP && posQ) ? posQ * lastP.c : null,
        openPnl: (lastP && posQ) ? (lastP.c - posAvgNF) * posQ : null,
        trades: closed.length, wins: wins,
        winRate: closed.length ? wins / closed.length * 100 : null,
        lastClose: lastP ? lastP.c : null, lastDate: lastP ? lastP.d : null
      }
    };
  }

    });
    h += '</div></section>';

    if (v.warn.length) {

        v.warn.slice(0, 8).map(function (w) {

            (w.posQ ? ' (보유 ' + qty(w.posQ) + '주)' : ' (보유 없음)') + '</li>';

    return h;

  function cell(k, v) { return '<div><div class="k">' + k + '</div><div class="v num">' + v + '</div></div>'; }

  /* ------- 차트 ------- */
  function chart(v) {
    var pts = v.rows.filter(function (r) { return r.net !== null; })
      .map(function (r) { return { d: r.d, y: v.sum.start ? r.cum / v.sum.start * 100 : r.cum }; });
    if (pts.length < 2) return '<div class="empty">거래가 2건 이상 쌓이면 그래프가 그려져요.</div>';
    var W = 560, H = 150, PL = 6, PR = 40, PT = 12, PB = 20;
    var ys = pts.map(function (p) { return p.y; });
    var mn = Math.min(0, Math.min.apply(null, ys)), mx = Math.max.apply(null, ys);
    if (mx === mn) mx = mn + 1;
    var pad = (mx - mn) * 0.12; mn -= pad; mx += pad;
    var X = function (i) { return PL + i * (W - PL - PR) / (pts.length - 1); };
    var Y = function (y) { return PT + (mx - y) / (mx - mn) * (H - PT - PB); };
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1); }).join(' ');
    var area = line + ' L' + X(pts.length - 1).toFixed(1) + ' ' + Y(Math.max(mn, 0)).toFixed(1) + ' L' + X(0).toFixed(1) + ' ' + Y(Math.max(mn, 0)).toFixed(1) + ' Z';
    var g = '';
    [mx, (mx + mn) / 2, mn].forEach(function (t) {
      g += '<line class="grid" x1="' + PL + '" x2="' + (W - PR) + '" y1="' + Y(t).toFixed(1) + '" y2="' + Y(t).toFixed(1) + '"/>' +
        '<text x="' + (W - PR + 5) + '" y="' + (Y(t) + 3.4).toFixed(1) + '">' + t.toFixed(0) + '%</text>';
    });
    if (mn < 0 && mx > 0) g += '<line class="zero" x1="' + PL + '" x2="' + (W - PR) + '" y1="' + Y(0).toFixed(1) + '" y2="' + Y(0).toFixed(1) + '"/>';
    var lastP = pts[pts.length - 1];
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="누적 수익률 추이">' +
      g + '<path class="ar" d="' + area + '"/><path class="ln" d="' + line + '"/>' +
      '<circle class="dot" cx="' + X(pts.length - 1).toFixed(1) + '" cy="' + Y(lastP.y).toFixed(1) + '" r="3.2"/>' +
      '<text x="' + PL + '" y="' + (H - 4) + '">' + md(pts[0].d) + '</text>' +
      '<text x="' + (W - PR) + '" y="' + (H - 4) + '" text-anchor="end">' + md(lastP.d) + '</text>' +
      '</svg>';
  }

  /* ------- 매매일지 ------- */
  function logTab(v) {
    var h = '<section class="card"><div class="card-h"><h2>매매일지</h2><div class="aside">' + v.rows.length + '건</div></div>' +

    var tlist = v.rows.slice().reverse(), tmore = tlist.length - lim.log;

      var i = S.trades.indexOf(r.t), isOpen = open === i;

  /* ------- 계산값 반영 ------- */
  function applyCalc(v) {
    var els = app.querySelectorAll('[data-calc]');
    var byIdx = {};
    v.rows.forEach(function (r) { byIdx[S.trades.indexOf(r.t)] = r; });
    Array.prototype.forEach.call(els, function (el) {
      var p = el.dataset.calc.split(':'), r = byIdx[+p[1]], f = p[2];
      if (!r) { el.textContent = '—'; return; }
      var out = '—', c = '';
      if (f === 'buyAmt') out = usd(r.buyAmt);
      else if (f === 'sellAmt') out = usd(r.sellAmt);
      else if (f === 'avg') out = r.posQ ? usd(r.posAvgNF) : usd(r.avgBefore);
      else if (f === 'posQ') out = qty(r.posQ) + '주';
      else if (f === 'net') { out = usd(r.net, true); c = cls(r.net); }
      else if (f === 'rate') { out = pct(r.rate, true); c = cls(r.rate); }
      else if (f === 'cum') { out = usd(r.cum, true); c = cls(r.cum); }
      else if (f === 'krw') { out = krw(r.cumKRW, true); c = cls(r.cumKRW); }
      else if (f === 'chg') { out = usd(r.chg.$, true); c = cls(r.chg.$); }
      else if (f === 'chgp') { out = pct(r.chg['%'], true); c = cls(r.chg['%']); }
      else if (f === 'matched') { out = r.sellAmt === null ? '—' : qty(r.matched || 0) + '주'; c = (r.unmatched > 1e-9 ? 'up' : ''); }
      else if (f === 'cost') out = usd(r.cost);
      if (f === 'hclose') { el.textContent = r.close === null ? '종가 없음' : usd(r.close); return; }
      if (f === 'hchgp') { el.textContent = pct(r.chg['%'], true); el.className = 'chg num ' + cls(r.chg['%']) + ''; el.dataset.calc = 't:' + p[1] + ':hchgp'; return; }
      el.textContent = out;
      el.className = 'v num ' + c;
    });
    Array.prototype.forEach.call(app.querySelectorAll('[data-fsum]'), function (el) {
      var q = el.dataset.fsum.split(':'), tt = S.trades[+q[0]];
      var s2 = roll(tt && tt[q[1]]);
      el.firstChild.textContent = fsumText(s2);
      el.lastChild.textContent = s2.q ? usd(s2.amt) : '';
    });
    var pcs = app.querySelectorAll('[data-pc]');
    Array.prototype.forEach.call(pcs, function (el) {
      var q = el.dataset.pc.split(':'), pr = S.prices[+q[0]];
      var ch = pr ? v.pchg[pr.d] : null;
      var val = ch ? ch[q[1]] : null;
      el.textContent = q[1] === '$' ? usd(val, true) : pct(val, true);
      el.className = 'num ' + cls(val);
    });
    var s = v.sum, hv = document.querySelector('.hd-total .v'), hs = document.querySelector('.hd-total .s');
    if (hv) { hv.textContent = usd(s.cum, true); hv.className = 'v num ' + cls(s.cum); }
    if (hs) hs.textContent = s.roi === null ? '' : pct(s.roi, true);
  }

  /* ------- 이벤트 ------- */
  app.addEventListener('input', function (e) {
    var el = e.target;
    if (!el.dataset || !el.dataset.k) return;
    var k = el.dataset.k, i = +el.dataset.i, f = el.dataset.f, val = el.value;
    if (k === 'close') {                       // 매매일지에서 그날 종가 입력
      var tr = S.trades[i]; if (!tr) return;
      var px = null;
      for (var z = 0; z < S.prices.length; z++) { if (S.prices[z].d === tr.d) { px = S.prices[z]; break; } }
      if (!px) { px = { d: tr.d, c: null }; S.prices.push(px); }
      px.c = n(val);
      markDirty(); applyCalc(derive()); return;
    }
    var obj = k === 'settings' ? S.settings : S[k][i];
    if (!obj) return;
    if (f === 'buys' || f === 'sells') {                 // 체결 칸
      var j = +el.dataset.j, sub = el.dataset.sub;
      var arr = obj[f] = obj[f] || [];
      while (arr.length <= j) arr.push({});
      if (val === '') delete arr[j][sub]; else arr[j][sub] = n(val);
      markDirty(); applyCalc(derive()); return;
    }
    if (f === 'label' || f === 'note' || f === 'ticker' || f === 'd' || f === 'ad' || f === 'date') obj[f] = val;
    else obj[f] = n(val);
    if (val === '') delete obj[f];
    markDirty();
    applyCalc(derive());
  });

  app.addEventListener('click', function (e) {
    var t = e.target.closest('[data-tab],[data-add],[data-del],[data-close],[data-open],[data-openr],[data-more],[data-recalc],[data-fill],#savebtn');
    if (!t) return;
    if (pendingDel && t.dataset.del !== pendingDel) { pendingDel = null; render(); }
    if (t.id === 'savebtn') { save(); return; }
    if (t.dataset.tab) { tab = t.dataset.tab; open = null; openR = null; render(); window.scrollTo(0, 0); return; }
    if (t.dataset.more) { lim[t.dataset.more] += 40; render(); return; }
    if (t.dataset.fill) {
      var fd = t.dataset.fill, px2 = null;
      for (var q2 = 0; q2 < S.prices.length; q2++) if (S.prices[q2].d === fd) { px2 = q2; break; }
      if (px2 === null) { S.prices.push({ d: fd, c: null }); px2 = S.prices.length - 1; markDirty(); }
      tab = 'price'; open = null; openR = null; pendingDel = null;
      render(); window.scrollTo(0, 0);
      var fel = app.querySelector('input.pin[data-i="' + px2 + '"]');
      if (fel) { fel.scrollIntoView({ block: 'center' }); fel.focus(); }
      return;
    }
    if (t.dataset.recalc !== undefined) {
      var rr = S.rounds[+t.dataset.recalc];
      var rp = n(rr.pu), rf = n(rr.fx) || n(S.settings.fxDefault);
      if (rp === null || !rf) { toast('수익금과 환율을 먼저 채워 주세요.'); return; }
      rr.pk = Math.round(rp * rf);
      markDirty(); render();
      toast('원화 수익금을 ' + krw(rr.pk) + ' 으로 계산했어요.');
      return;
    }
    if (t.dataset.close !== undefined) { open = null; openR = null; pendingDel = null; render(); return; }
    if (t.dataset.del) {
      var key = t.dataset.del;
      if (pendingDel !== key) { pendingDel = key; render(); toast('한 번 더 누르면 삭제돼요.'); return; }   // 1차: 확인 대기
      var p = key.split(':');
      S[p[0]].splice(+p[1], 1);
      pendingDel = null; open = null; openR = null; markDirty(); render();
      toast('삭제했어요. 저장을 눌러야 앱에 반영돼요.');
      return;
    }
    if (t.dataset.add) {
      var newPrice = null;
      var d = lastUsDate();                    // 국내 오늘 새벽에 끝난 미국장
      while (S.trades.some(function (x) { return x.d === d; })) d = shift(d, 1);
      if (t.dataset.add === 'price') {
        var pd = lastUsDate(), mx = null;
        S.prices.forEach(function (p) { if (p.d && (mx === null || p.d > mx)) mx = p.d; });
        if (mx !== null && mx >= pd) pd = nextWk(mx);
        while (S.prices.some(function (p) { return p.d === pd; })) pd = nextWk(pd);
        S.prices.push({ d: pd, c: null });
        newPrice = S.prices.length - 1;
      }
      if (t.dataset.add === 'trade') {
        if (!S.prices.some(function (p) { return p.d === d; })) S.prices.push({ d: d, c: null });
        S.trades.push({ d: d, ad: krDate(d), fx: n(S.settings.fxDefault) || null, buys: [], sells: [] });
        open = S.trades.length - 1;
      }
      if (t.dataset.add === 'round') { S.rounds.push({ label: '', usd: null, pu: null, krw: null, fx: n(S.settings.fxDefault) || null, date: today(), pk: null, note: '' }); openR = S.rounds.length - 1; }
      markDirty(); render();
      if (newPrice !== null) {
        var pel = app.querySelector('input.pin[data-i="' + newPrice + '"]');
        if (pel) { pel.scrollIntoView({ block: 'center' }); pel.focus(); }
        toast('날짜를 확인하고 종가를 입력하세요.');
        return;
      }
      var el2 = app.querySelector('.ed input');
      if (el2) el2.focus();
      return;
    }
    if (t.dataset.open !== undefined && !e.target.closest('[data-stop]')) {
      var idx = +t.dataset.open;
      open = open === idx ? null : idx; openR = null;
      render();
      return;
    }
    if (t.dataset.openr !== undefined && !e.target.closest('[data-stop]')) {
      var idr = +t.dataset.openr;
      openR = openR === idr ? null : idr; open = null;
      render();
      return;
    }
  });

  /* ------- 백업 ------- */
  function backupBar() {

      '<div class="bkbar">' +
      '<button class="btn wide" data-bk="out">기록 내보내기</button>' +

      '</div></section>';

  function doExport() {
    try {
      var name = BKNAME + '-' + today() + '.json';
      var blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
      toast(name + ' 로 내려받았어요.');
    } catch (e) { toast('내보내기에 실패했어요.'); }
  }
  function doImport() {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'application/json,.json';
    inp.onchange = function () {
      var f = inp.files && inp.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(String(fr.result));
          if (!d || typeof d !== 'object' || !d.settings) throw 0;
          S = d;
          S.settings = S.settings || {};
          S.prices = S.prices || []; S.trades = S.trades || [];
          if (S.rounds === undefined) S.rounds = [];
          if (S.cycles === undefined) S.cycles = [];
          markDirty(); render(); pullPrices();
          toast('불러왔어요. 기록 ' + (S.trades.length) + '건.');
        } catch (e) { toast('파일을 읽지 못했어요. 내보내기로 받은 json 파일인지 확인해 주세요.'); }
      };
      fr.readAsText(f);
    };
    inp.click();
  }

  /* ------- 종가 자동 수신 ------- */
  function pullPrices() {
    if (!window.fetch) return;
    fetch('prices.json?t=' + Date.now()).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j) return;
        var map = {}, added = 0;
        S.prices.forEach(function (p) { if (p && p.d) map[p.d] = p; });
        (j.prices || []).forEach(function (x) {
          if (!x || !x.d || x.c === null || x.c === undefined || x.c === '') return;
          var e = map[x.d];
          if (!e) { S.prices.push({ d: x.d, c: x.c }); added++; }
          else if (e.c === null || e.c === undefined || e.c === '') { e.c = x.c; added++; }
        });
        var fxNew = false, fx = +j.fx;
        if (fx && isFinite(fx)) {
          if (n(S.settings[FXKEY]) !== fx) { S.settings[FXKEY] = fx; fxNew = true; }
        }
        if (added || fxNew) {
          try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
          render();
          toast(added ? ('종가 ' + added + '일치를 자동으로 받았어요.') : ('환율을 ' + fx.toLocaleString('ko-KR') + '원으로 갱신했어요.'));
        }
      })['catch'](function () {});
  }

  app.addEventListener('click', function (e) {
    var t = e.target.closest('[data-bk]');
    if (!t) return;
    if (t.dataset.bk === 'out') doExport(); else doImport();
  });

  render();
  pullPrices();
})();
</script>
<script>(new Function(document.getElementById("code").textContent))();</script>
